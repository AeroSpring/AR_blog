{% extends "base.html" %}
{% block content %}
<div class="edit-comment-container">
    <h2>Редактирование комментария</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ comment.article.url }}?page={{ request.GET.page }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
