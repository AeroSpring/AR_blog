{% extends "base.html" %}
{% block content %}

<div class="delete-comment-container">
    <h2>Удаление комментария</h2>
    <p>Вы уверены, что хотите удалить этот комментарий?</p>
    <blockquote>{{ comment.text|linebreaks }}</blockquote>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{{ comment.article.url }}?page={{ request.GET.page }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
